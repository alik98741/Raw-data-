name: USDA maize AquaCrop EJA online

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  aquacrop:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[RUN GENUINE AQUACROP]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install aquacrop==3.1.0 pandas numpy openpyxl scikit-learn
      - name: Run AquaCrop
        run: python maize-aquacrop-eja/smoke_aquacrop.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usda-maize-aquacrop-prior-24
          path: maize-aquacrop-eja/prior_outputs/
          if-no-files-found: warn
          retention-days: 30
