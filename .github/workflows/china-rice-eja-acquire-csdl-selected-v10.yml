name: China Rice EJA Acquire CSDL selected v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'rice-eja-acquisition/acquire_csdl_selected_v10.py'
      - '.github/workflows/china-rice-eja-acquire-csdl-selected-v10.yml'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas rasterio geopandas pyogrio shapely
      - name: Download and aggregate selected CSDLv2 1km soil layers
        run: python rice-eja-acquisition/acquire_csdl_selected_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-csdl-selected-v10
          path: rice-eja-acquisition/csdl-selected-v10/
          retention-days: 30
          compression-level: 6
