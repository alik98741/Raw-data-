name: Sugarcane Industrial MapBiomas Coverage v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'sugarcane-industrial-algorithms/acquire_mapbiomas_coverage_v1.py'
      - '.github/workflows/sugarcane-industrial-mapbiomas-coverage-v1.yml'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pandas openpyxl
      - name: Extract official MapBiomas Collection 10.1 sugarcane statistics
        run: python sugarcane-industrial-algorithms/acquire_mapbiomas_coverage_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sugarcane-industrial-mapbiomas-coverage-v1
          path: sugarcane-industrial-algorithms/mapbiomas-coverage-v1/
          retention-days: 30
