name: China Rice EJA AgERA5 auth probe v10

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/china-rice-eja-agera5-auth-probe-v10.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check CDS token presence safely
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          mkdir -p out
          python -c "import os,pathlib; pathlib.Path('out/status.txt').write_text('CDS_SECRET_PRESENT='+('1' if os.getenv('CDSAPI_KEY') else '0')+'\n')"
          cat out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-agera5-auth-probe-v10
          path: out/
          retention-days: 30
