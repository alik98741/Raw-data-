name: China Rice EJA CSDL inspect 10km bands v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'rice-eja-acquisition/tpdc_csdl_inspect_10km_raster_bands_v10.py'
      - '.github/workflows/china-rice-eja-csdl-inspect-10km-bands-v10.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rasterio
      - run: python rice-eja-acquisition/tpdc_csdl_inspect_10km_raster_bands_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-csdl-10km-band-inspect-v10
          path: rice-eja-acquisition/csdl-10km-band-inspect-v10/
          retention-days: 30
