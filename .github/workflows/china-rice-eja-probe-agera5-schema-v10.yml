name: China Rice EJA Probe AgERA5 schema v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'rice-eja-acquisition/probe_agera5_cds_schema_v10.py'
      - '.github/workflows/china-rice-eja-probe-agera5-schema-v10.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rice-eja-acquisition/probe_agera5_cds_schema_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-agera5-schema-v10
          path: rice-eja-acquisition/agera5-schema-v10/
          retention-days: 30
