name: Maize EJA AquaCrop analysis
on:
  push:
    branches: [maize-aquacrop-eja-2012-2013]
    paths:
      - 'maize-aquacrop-eja/run_aquacrop.py'
      - '.github/workflows/maize-aquacrop-eja.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aquacrop-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact AquaCrop implementation
        run: |
          python -m pip install --upgrade pip
          pip install 'aquacrop==3.1.0'
      - name: Download public USDA source data
        run: |
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/44526245' -o maize_2012_2013.xlsx
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/44334653' -o LIRF_Soils.xlsx
          sha256sum maize_2012_2013.xlsx LIRF_Soils.xlsx
      - name: Run actual AquaCrop-OSPy analysis
        run: python maize-aquacrop-eja/run_aquacrop.py
      - name: Commit reproducible result files to analysis branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maize-aquacrop-eja/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Add AquaCrop-OSPy baseline results'
            git push
          fi
