name: Maize EJA AquaCrop analysis
on:
  push:
    branches: [maize-aquacrop-eja-2012-2013]
    paths:
      - 'maize-aquacrop-eja/run_aquacrop.py'
      - 'maize-aquacrop-eja/root_initial_sensitivity.py'
      - 'maize-aquacrop-eja/hybrid_actual_aquacrop.py'
      - '.github/workflows/maize-aquacrop-eja.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aquacrop-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install pandas numpy scikit-learn
      - name: Run blind-year AquaCrop-AI analysis
        run: python maize-aquacrop-eja/hybrid_actual_aquacrop.py
      - name: Commit reproducible hybrid results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maize-aquacrop-eja/results_hybrid
          if git diff --cached --quiet; then echo 'No result changes to commit.'; else git commit -m 'Add blind-year AquaCrop-AI results'; git push; fi
