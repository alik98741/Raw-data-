name: Maize EJA AquaCrop analysis
on:
  push:
    branches: [maize-aquacrop-eja-2012-2013]
    paths:
      - 'maize-aquacrop-eja/hybrid_actual_aquacrop_v2.py'
      - '.github/workflows/maize-aquacrop-eja.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aquacrop-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install pandas numpy scikit-learn
      - name: Download USDA source workbook for causal weather-management features
        run: curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/44526245' -o maize_2012_2013.xlsx
      - name: Run corrected blind-year AquaCrop-AI analysis
        run: python maize-aquacrop-eja/hybrid_actual_aquacrop_v2.py
      - name: Commit corrected hybrid results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maize-aquacrop-eja/results_hybrid_v2
          if git diff --cached --quiet; then echo 'No result changes to commit.'; else git commit -m 'Add corrected daily-history AquaCrop-AI results'; git push; fi
