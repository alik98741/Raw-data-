name: China Rice EJA Acquire CSDL TPDC mean v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'rice-eja-acquisition/acquire_csdl_tpdc_mean_v10.py'
      - '.github/workflows/china-rice-eja-acquire-csdl-tpdc-mean-v10.yml'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas rasterio geopandas pyogrio shapely
      - name: Acquire and aggregate real CSDLv2 1km mean binaries
        run: python rice-eja-acquisition/acquire_csdl_tpdc_mean_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-csdl-tpdc-mean-v10
          path: rice-eja-acquisition/csdl-tpdc-mean-v10/
          retention-days: 30
          compression-level: 6
