name: China Rice EJA TPDC CSDL quantile check v10

on:
  workflow_dispatch:
  push:
    paths:
      - 'rice-eja-acquisition/tpdc_csdl_check_quantiles_v10.py'
      - '.github/workflows/china-rice-eja-tpdc-csdl-quantile-check-v10.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rice-eja-acquisition/tpdc_csdl_check_quantiles_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-tpdc-csdl-quantile-check-v10
          path: rice-eja-acquisition/tpdc-csdl-quantile-check-v10/
          retention-days: 30
