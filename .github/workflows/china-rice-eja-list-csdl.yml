name: China Rice EJA List CSDLv2 Files
on:
  workflow_dispatch:
  push:
    paths:
      - 'rice-eja-acquisition/list_csdl_files.py'
      - '.github/workflows/china-rice-eja-list-csdl.yml'
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rice-eja-acquisition/list_csdl_files.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-rice-eja-csdl-file-tree
          path: rice-eja-acquisition/csdl-files/
          retention-days: 30
