name: Sugarcane Industrial Observed Acquisition v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'sugarcane-industrial-algorithms/acquire_observed_public_v1.py'
      - '.github/workflows/sugarcane-industrial-observed-acquisition-v1.yml'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: pip install requests pandas numpy
      - name: Acquire official IBGE and ANP observations
        run: python sugarcane-industrial-algorithms/acquire_observed_public_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sugarcane-industrial-observed-public-v1
          path: sugarcane-industrial-algorithms/observed-public-v1/
          retention-days: 30
