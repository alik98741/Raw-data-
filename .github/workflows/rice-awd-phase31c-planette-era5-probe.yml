name: Rice AWD Phase31c Planette ERA5 public probe

on:
  push:
    paths:
      - '.github/workflows/rice-awd-phase31c-planette-era5-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q 'icechunk>=1,<3' xarray zarr s3fs numpy pandas dask
      - name: Probe public monthly stores
        run: |
          python - <<'PY'
          import icechunk as ic, xarray as xr, json
          from pathlib import Path
          out=Path('out');out.mkdir(exist_ok=True)
          result={}
          for var in ['t2m','t2m_min','t2m_max','pr']:
            prefix=f'era5/{var}/month/0p25latx0p25lon/era5_{var}_month_0p25latx0p25lon.zarr'
            d={'prefix':prefix}
            try:
              storage=ic.s3_storage(bucket='planette-era5',prefix=prefix,region='us-east-2',anonymous=True)
              repo=ic.Repository.open(storage=storage)
              sess=repo.readonly_session('main')
              ds=xr.open_dataset(sess.store,engine='zarr',consolidated=False,chunks={})
              d.update(status='PASS',dims={k:int(v) for k,v in ds.sizes.items()},coords=list(ds.coords),vars=list(ds.data_vars),attrs={k:str(v) for k,v in ds.attrs.items()},var_attrs={v:{k:str(x) for k,x in ds[v].attrs.items()} for v in ds.data_vars})
              vn=var if var in ds.data_vars else list(ds.data_vars)[0]
              latn='latitude' if 'latitude' in ds.coords else 'lat'; lonn='longitude' if 'longitude' in ds.coords else 'lon'; timen='time'
              sample=ds[vn].sel({timen:slice('2001-01-01','2001-02-01'),latn:25.0,lonn:100.0},method='nearest').compute()
              d['sample']=[float(x) for x in sample.values.ravel()[:4]]
            except Exception as e: d.update(status='FAIL',error=repr(e))
            result[var]=d
          (out/'probe.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2)[:30000])
          if sum(x['status']=='PASS' for x in result.values())<4: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rice-awd-phase31c-planette-era5-probe
          path: out/
          retention-days: 7
